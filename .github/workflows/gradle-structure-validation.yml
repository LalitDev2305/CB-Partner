name: Gradle Structure Validation

on:
  push:
    branches:
      - main
    paths:
      - "build-logic/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "**/*.gradle.kts"
      - ".github/workflows/gradle-structure-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Desktop and Android builds
        run: ./gradlew :desktopApp:compileKotlin :androidApp:assembleDebug --stacktrace
